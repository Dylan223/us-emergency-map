name: Refresh emergency data

on:
  schedule:
    # Every 15 minutes (UTC). GitHub may delay scheduled runs during
    # high load; this is a best-effort cadence.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    # Manual trigger from the Actions tab.

permissions:
  contents: write   # needed to push the updated GeoJSON back to the repo

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL || 'noreply@example.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingest
        run: python -m ingest.main

      - name: Commit updated data (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/events.geojson
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: refresh emergency data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
